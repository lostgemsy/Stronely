<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>City FPS</title>
  </head>
  <body>
    <div id="game-hud" class="hidden">
      <div id="status">Connecting…</div>
      <button id="logout" type="button">Sign out</button>
      <div id="crosshair">+</div>
      <div id="play-hint">Click the world to play · WASD move · Shift sprint · Space jump · Esc unlock mouse</div>
      <aside id="chat-panel">
        <div class="chat-heading"><strong>ROOM CHAT</strong><span id="room-label"></span></div>
        <div id="chat-messages" aria-live="polite"></div>
        <form id="chat-form"><input id="chat-input" maxlength="300" autocomplete="off" placeholder="Message your room…" aria-label="Chat message" /><button type="submit">Send</button></form>
      </aside>
    </div>

    <main id="auth-overlay">
      <section class="auth-card">
        <p class="eyebrow">MULTIPLAYER CITY</p>
        <h1>Enter the city.</h1>
        <p class="intro">Create a username and password, then meet your friends in the same room.</p>
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-mode="signin" type="button">Sign in</button>
          <button class="auth-tab" data-mode="signup" type="button">Create account</button>
        </div>
        <form id="auth-form">
          <label for="username">Username</label>
          <input id="username" name="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required />
          <button id="auth-submit" class="primary" type="submit">Sign in</button>
        </form>
        <p id="auth-error" role="status"></p>
        <p class="room-note">Room: <code id="auth-room"></code> · Share the same link to play together.</p>
      </section>
      <div class="corner-mark">FPS / 001</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
